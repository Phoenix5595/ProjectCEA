[project]
name = "projectcea"
version = "1.0.0"
description = "Raspberry Pi 5 CEA automation system"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
include = [
    "Infrastructure/automation-service/app/**/*.py",
    "Infrastructure/backend/app/**/*.py",
    "Infrastructure/shared/**/*.py",
    "Infrastructure/**/scripts/**/*.py",
]

# Exclude common non-source directories
exclude = [
    ".git",
    ".omo",
    ".opencode",
    ".venv",
    "venv",
    "**/.venv",
    "**/venv",
    "archive",
    "__pycache__",
    "node_modules",
    "dist",
    "build",
    "**/generated",
    "**/test-results",
    "**/playwright-report",
    "**/coverage",
    ".mypy_cache",
    ".ruff_cache",
    "**/*.md",
    "**/*.markdown",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
    "B904",   # raise without from (too noisy for now)
    "C901",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["app", "shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
