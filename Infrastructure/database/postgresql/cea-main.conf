# ProjectCEA production cluster (15/main). Canonical copy: Infrastructure/database/postgresql/cea-main.conf
# Installed to /etc/postgresql/15/main/conf.d/cea-main.conf (see Infrastructure/database/AGENTS.md).
# Changing shared_buffers or shared_preload_libraries requires a PostgreSQL restart.

# Memory (8 GB host; work_mem stays 16MB from postgresql.conf)
shared_buffers = 1GB
effective_cache_size = 4GB
maintenance_work_mem = 512MB

# Extensions and query statistics
shared_preload_libraries = 'timescaledb,pg_stat_statements,auto_explain'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on

# Keep small tables' planner statistics current (default 50 rows)
autovacuum_analyze_threshold = 5

# Logging
log_min_duration_statement = 1000
log_autovacuum_min_duration = 0
log_lock_waits = on
log_temp_files = 0
log_checkpoints = on
auto_explain.log_min_duration = '5s'
auto_explain.log_analyze = off
auto_explain.log_nested_statements = off
