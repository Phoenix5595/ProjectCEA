# Soil Sensor RS485 Service Configuration
# Configuration for DFRobot RS485 4-in-1 Soil Sensors

# RS485 serial port configuration: Pi GPIO UART (GPIO14 TX / GPIO15 RX,
# dtparam=uart0=on) through a DFRobot DFR0845 RS485-to-UART module.
# 8N1 is fixed in code. /dev/serial0 is the Pi 5 debug UART: never use it.
rs485:
  port: /dev/ttyAMA0
  baudrate: 9600            # SEN0604 factory baudrate
  timeout: 0.5              # Poll read timeout (s)
  scan_timeout: 0.2         # Discovery/commissioning read timeout (s)
  inter_frame_delay: 0.005  # Minimum gap between frames (s), >= 4 byte-times

# Polling configuration
polling:
  interval_seconds: 5  # Poll sensors every 5 seconds
  discovery_interval_seconds: 30  # Scan for new sensors every 30 seconds

# Sensor identity and placement live in `sensor_registry`,
# `sensor_address_history` and `soil_probe_placement` (sj_cea). The Modbus
# address is the probe's device ID: new probes at factory address 1 are
# written to the lowest never-used address in 2-254 and registered
# unassigned. This file deliberately holds no sensor list and never
# chooses a bed.
