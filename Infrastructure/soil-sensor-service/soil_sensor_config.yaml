# Soil Sensor RS485 Service Configuration
# Configuration for DFRobot RS485 4-in-1 Soil Sensors

# RS485 serial port configuration
rs485:
  port: /dev/ttyUSB0  # USB adapter port (corrected from serial0)
  baudrate: 9600      # Modbus RTU baudrate
  timeout: 1.0        # Serial read timeout in seconds

# Sensor configurations
# Use discovered sensor IDs (likely 1, 2, 3) instead of high-range IDs
sensors:
  - modbus_id: 226
    name: "soil_sensor_front_bed"
    bed_name: "Front Bed"
    room_name: "Flower Room"
  
  - modbus_id: 227
    name: "soil_sensor_back_bed"
    bed_name: "Back Bed"
    room_name: "Flower Room"
  
  - modbus_id: 228
    name: "soil_sensor_1"
    bed_name: "Front Bed"
    room_name: "Flower Room"

# Polling configuration
polling:
  interval_seconds: 5  # Poll sensors every 5 seconds
  discovery_interval_seconds: 30  # Scan for new sensors every 30 seconds

# Automatic sensor discovery
# The service will automatically scan RS485 bus and configure proper sensor IDs
# based on discovered hardware