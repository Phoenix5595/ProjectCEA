[Service]
User=root
Group=root
PrivateTmp=false
ProtectSystem=false
ProtectHome=false
ReadWritePaths=
WorkingDirectory=
WorkingDirectory=/opt/projectcea/current/Infrastructure/automation-service
ExecStart=
# Keep --timeout-graceful-shutdown 5 in step with automation-service.service: this
# drop-in's ExecStart is the effective one.
ExecStart=/opt/projectcea/current/Infrastructure/automation-service/.venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 --timeout-graceful-shutdown 5
Environment=
Environment=PYTHONPATH=/opt/projectcea/current/Infrastructure:/opt/projectcea/current/Infrastructure/automation-service
Environment=REDIS_URL=redis://localhost:6379
Environment=POSTGRES_HOST=localhost
Environment=POSTGRES_DB=sj_cea
Environment=POSTGRES_USER=cea_user
EnvironmentFile=-/opt/projectcea/shared/env/postgres.env
# CALENDAR_SYNC_ENCRYPTION_KEY (Fernet), shared with grow-archive-service.
EnvironmentFile=-/opt/projectcea/shared/env/calendar_sync.env
