hardware:
  i2c_bus: 0
  mcp_i2c_bus: 0       # Relays only (MCP23017); MCP is connected on bus 0
  dfr0971_i2c_bus: 1   # Dimming only (DF Robot DAC)
  i2c_address: 39
  active_low: true     # SainSmart 16-channel relay board is active-LOW (Low Level Trigger)
  require_mcp: true    # FATAL on probe failure — no silent simulation fallback
  dfr0971_boards:
  - board_id: 0
    i2c_address: 88
    name: Veg Top and Bottom Right Light Board
  - board_id: 1
    i2c_address: 89
    name: Apache° and Veg Bottom Left Light Board
  - board_id: 2
    i2c_address: 90
    name: Chilled Light Board
devices:
  Flower Room:
    main:
      exhaust_fan:
        channel: 1
        device_type: fan
        pid_enabled: false
        interlock_with: []
      light_1:
        display_name: Chilled Front
        channel: 3
        device_type: light
        pid_enabled: false
        interlock_with: []
        dimming_enabled: true
        dimming_type: dfr0971
        dimming_board_id: 2
        dimming_channel: 0
        safety_level: 0
      light_2:
        display_name: Apache
        channel: 4
        device_type: light
        pid_enabled: false
        interlock_with: []
        dimming_enabled: true
        dimming_type: dfr0971
        dimming_board_id: 1
        dimming_channel: 1
        safety_level: 0
      light_3:
        display_name: Chilled Back
        channel: 5
        device_type: light
        pid_enabled: false
        interlock_with: []
        dimming_enabled: true
        dimming_type: dfr0971
        dimming_board_id: 2
        dimming_channel: 1
        safety_level: 0
      Midea Cube 50 pints:
        channel: 2
        device_type: dehumidifier
      Heater Flower:
        channel: 0
        device_type: heating
  Veg Room:
    main:
      exhaust_fan:
        channel: 9
        device_type: fan
        pid_enabled: false
        interlock_with: []
      light_1:
        channel: 3
        device_type: light
        display_name: Eyefinity Top
        pid_enabled: false
        interlock_with: []
        dimming_enabled: true
        dimming_type: dfr0971
        dimming_board_id: 0
        dimming_channel: 0
        safety_level: 0
      light_2:
        display_name: Ridgetop Bottom Right
        channel: 4
        device_type: light
        pid_enabled: false
        interlock_with: []
        dimming_enabled: true
        dimming_type: dfr0971
        dimming_board_id: 0
        dimming_channel: 1
        safety_level: 40
      light_3:
        display_name: Ridgetop Bottom Left
        channel: 5
        device_type: light
        pid_enabled: false
        interlock_with: []
        dimming_enabled: true
        dimming_type: dfr0971
        dimming_board_id: 1
        dimming_channel: 0
        safety_level: 40
      Heater Veg:
        channel: 6
        device_type: heating
      Ivation 35 pints:
        channel: 7
        device_type: dehumidifier
      Exhaust 4 inches:
        channel: 8
        device_type: fan
control:
  pid:
    heater_kp: 25.0
    heater_ki: 0.02
    heater_kd: 0.0
    fan_kp: 25.0
    fan_ki: 0.02
    fan_kd: 0.0
    co2_kp: 10.0
    co2_ki: 0.01
    co2_kd: 0.0
    default_kp: 10.0
    default_ki: 0.01
    default_kd: 0.0
  safety_limits:
    max_temperature: 35.0
    min_temperature: 10.0
    max_humidity: 90.0
    min_humidity: 30.0
    max_co2: 2000.0
    min_co2: 400.0
  default_setpoints:
    Flower Room:
      main:
        heating_setpoint: 25.0
        cooling_setpoint: null
        humidity: 65.0
        co2: 1200.0
    Veg Room:
      main:
        heating_setpoint: 25.0
        cooling_setpoint: null
        humidity: 68.0
        co2: 1000.0
  update_interval: 1
  last_good_hold_period: 30
  binary_hysteresis: 0.1
  pid_limits:
    heater:
      kp_min: 0.0
      kp_max: 100.0
      ki_min: 0.0
      ki_max: 1.0
      kd_min: 0.0
      kd_max: 10.0
    fan:
      kp_min: 0.0
      kp_max: 100.0
      ki_min: 0.0
      ki_max: 1.0
      kd_min: 0.0
      kd_max: 10.0
    co2:
      kp_min: 0.0
      kp_max: 50.0
      ki_min: 0.0
      ki_max: 0.5
      kd_min: 0.0
      kd_max: 5.0
# interlocks removed per user decision 2026-06-24; corrected exhaust<->heater rule with real device names (Heater Flower/Heater Veg) deferred to future plan. See AGENTS.md VPD safety rule.
sensors:
  Flower Room:
    # Sensor clusters only (front/back). Control loop uses `main` PVs (same as back canopy node).
    main:
      temperature_sensor: dry_bulb_b
      humidity_sensor: rh_b
      co2_sensor: co2_b
      vpd_sensor: vpd_b
    front:
      temperature_sensor: dry_bulb_f
      humidity_sensor: rh_f
      co2_sensor: co2_f
      vpd_sensor: vpd_f
    back:
      temperature_sensor: dry_bulb_b
      humidity_sensor: rh_b
      co2_sensor: co2_b
      vpd_sensor: vpd_b
  Veg Room:
    main:
      temperature_sensor: dry_bulb_v
      humidity_sensor: rh_v
      co2_sensor: co2_v
      vpd_sensor: vpd_v
