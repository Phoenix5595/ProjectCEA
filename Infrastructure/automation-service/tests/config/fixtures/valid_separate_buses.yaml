# MCP on bus 0 (relays), DFR0971 on bus 1 (dimming)
hardware:
  i2c_bus: 1
  mcp_i2c_bus: 0
  dfr0971_i2c_bus: 1
  i2c_address: 32
  simulation: true
  dfr0971_boards:
    - board_id: 0
      i2c_address: 88
      name: Test Board
devices:
  Test Room:
    main:
      light_1:
        channel: 0
        device_type: light
        dimming_enabled: true
        dimming_board_id: 0
        dimming_channel: 0
      fan_1:
        channel: 1
        device_type: fan
control:
  update_interval: 2
